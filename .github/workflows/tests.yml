name: Tests

# The daily pipeline pushes feed XML, scraped JSON and the catalog built from
# them to main several times a day. Those commits change no code, so testing them only spent Actions
# minutes; ignore them (and docs) here. If the main-branch ruleset is ever
# re-enabled with "Tests" as a required check, a PR touching only these paths
# will wait on a check that never starts.
on:
  push:
    branches: [ main, test-branch-protection ]
    paths-ignore:
      - 'public/feeds/**'
      - 'public/catalog.json'
      - 'data/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'public/feeds/**'
      - 'public/catalog.json'
      - 'data/**'
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # The version the production pipeline host runs.
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    # Installs with -c constraints.txt, the same lock the host venv uses, so a
    # green run has tested what production actually runs. Unconstrained, CI
    # stayed green on patched brotli (#243) and certifi (#247) while the host
    # still ran the vulnerable versions. The unconstrained canary for new
    # transitive releases now runs weekly, off the merge path, in
    # dependency-canary.yml. A requirements.txt bump that conflicts with its
    # constraints.txt pin fails here by design: bump both.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -c constraints.txt
        pip install -e ".[dev]" -c constraints.txt

    # pytest.ini already enables --cov; one run produces both the test result
    # and the XML report Codecov needs.
    - name: Run tests with pytest
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: python -m pytest -vv --showlocals --cov-report=xml

    - name: Upload coverage reports to Codecov
      if: always()  # Run even if tests fail
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
